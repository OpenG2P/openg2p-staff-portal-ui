questions:

# General
- variable: global.domain
  description: Base domain under which all services are installed (e.g. openg2p.org). Other hostnames derive from this unless overridden.
  type: string
  label: Base Domain
  group: General

- variable: global.staffPortalHostname
  description: Hostname under which the Staff Portal UI will be accessed
  type: string
  label: Staff Portal Hostname
  group: General

- variable: staffPortalUi.enabled
  description: Install Staff Portal UI
  type: boolean
  label: Staff Portal UI
  group: General

# Security & Authentication
- variable: global.cookieDomain
  description: Cookie domain shared across Staff Portal UI and sibling APIs. Scoped to namespace by default to prevent cross-environment cookie leakage.
  type: string
  label: Cookie Domain
  group: Security & Authentication

- variable: global.iamServiceUrl
  description: Internal URL of the IAM (Staff Portal API) service
  type: string
  label: IAM Service URL
  group: Security & Authentication

- variable: global.keycloakBaseUrl
  description: Base URL of the Keycloak server
  type: string
  label: Keycloak Base URL
  group: Security & Authentication

- variable: global.keycloakRealm
  description: Keycloak realm used for Staff Portal authentication
  type: string
  label: Keycloak Realm
  group: Security & Authentication

- variable: global.keycloakIssuerUrl
  description: Full Keycloak issuer URL (derived from Keycloak Base URL and Realm by default)
  type: string
  label: Keycloak Issuer URL
  group: Security & Authentication

# Image
- variable: staffPortalUi.image.repository
  description: Docker image repository for Staff Portal UI
  type: string
  label: Image Repository
  group: Image

- variable: staffPortalUi.image.tag
  description: Docker image tag
  type: string
  label: Image Tag
  group: Image

